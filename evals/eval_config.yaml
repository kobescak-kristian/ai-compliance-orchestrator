# Eval gate v2 for ai-compliance-orchestrator (repair program P-001).
# Written in phase P1, before any P2 code. A change applies only to the
# next gate version; a recorded result is never edited (eval-gate rules
# 2, 6 and §7). The v1.0 gate (BLUEPRINT.md §7 original text) and its
# July FAIL (gate-9328e564) stay as recorded; the v1.0 version of this
# file is in Git history (last at commit 62f5935) and its thresholds are
# copied under v1_reference for comparison only. Red team 1 report:
# evals/v2/RED_TEAM_1.md (findings resolved in this version).

version: "2.0"
written: 2026-11-02
status: "FROZEN on owner sign-off at the P1 stop (open items: ruleset v1.1 text; off-target guardrail rule, RT1-06). Until then no H1 key is frozen and no P2 code is written."

eval_level:
  proposed: "Light (portfolio demo; a human approves every proposal)"
  decided: "Standard, owner, 2026-11-02 (public rate claim)"

# Eval-gate exception (owner, 2026-11-02; this repo only). Full signed
# text: STATE.md open loops and BLUEPRINT.md §7 amendment. Official tests
# are private holdouts; Git holds spec, manifests, grader and sanitized
# results only.
exception: private_holdouts

overall:
  rule: "PASS iff component_a passes AND component_b passes; otherwise FAIL"
  series: "one official series = A1 and A3 on the frozen commit, then 3 full-workflow runs of that commit on one private holdout"
  runs_independent: "each run starts with a new, empty ledger DB and audit DB, a new run_id and no result cache; the series record names each run's DB file"
  results: [PASS, FAIL, INVALID RUN, NOT ENOUGH CASES]

# ---------------------------------------------------------------------
# Component A: deterministic architecture and reliability. Code checks,
# 100% required. A1 and A3 run once on the frozen commit; A2 runs on each
# of the 3 runs. A timeout or FAILED task inside a run is not an A failure
# by itself: A checks that it was recorded and is terminal; its quality
# cost lands in B as a miss.
# ---------------------------------------------------------------------
component_a:
  required: "100% of checks"
  a1_keyless_suite:
    command: "python -m pytest -q -p no:cacheprovider"
    pass: "exit 0, zero failed, zero errors, on the frozen commit"
    must_include:
      - "FI-1..FI-7 failure-injection tests"
      - "append-only adjudication log; checker, verifier and planner cage tests; pipeline end to end on stubs; sweep"
      - "P2 regression tests, one per defect: D1 reader shows headings, lists and tables; D2 scorer counts failed or missing cells as misses; D3 verifier pin and clean-tree check; D4 rule coverage and rule citation; D5 verbatim excerpt check; D6 timeouts end in FAILED; D8 page-content delimiting and HTML escaping; D9 runner results file, classification and exit code; unknown rule ends in FAILED"
      - "human gate: approve/reject round trip, idempotent repeat, planner has no approve path"
      - "ABSENT rule both ways: tool accepts ABSENT and rejects a non-verbatim text excerpt; planner-integrity passes an absence insertion and fails an off-page quote; A3 passes a true absence and flags present required content"
      - "shared text rule: grader, reader and tool give the same normalized text on the RT1-11 inputs (block joins, entities, quote and dash variants, soft hyphen, zero-width space, ellipsis)"
      - "sanitized-results allowlist test"
      - "holdout self-check plants each mistake and stops (tests/test_check_holdout.py)"
  a2_run_derived:
    source: "each official run's ledger DB and audit DB; no extra model call"
    checks:
      - "coverage: every rule of every target market of every page is assigned to exactly one check task in the run"
      - "every task terminal; zero lost; zero stuck RUNNING"
      - "every DONE check task has exactly one finding per assigned rule"
      - "every finding cites a rule_id of its task's ruleset and that ruleset's version"
      - "the run used the rule files whose SHA-256 is recorded under datasets.ruleset_sha256"
      - "independence: every check task has at least one model call recorded in this run's own audit DB"
      - "audit rows show only whitelisted tool names per agent"
      - "no answer-key or holdout marker in any agent input or output (assert_no_key_leak, extended with holdout_markers below)"
      - "verifier checkout HEAD equals config.yaml pin and its tree is clean after the run"
      - "resume rerun on the same DB makes zero model calls and adds zero rows"
    planner_integrity:
      - "every CONFIRMED VIOLATION finding has exactly one proposal, and every proposal is PENDING"
      - "every proposal resolves evidence_refs[0] + '::' + rule_id to a finding with a CONFIRMED adjudication row for the same run and page; no proposal for a REJECTED, DISPUTED or non-VIOLATION finding"
      - "offending_text equals that finding's evidence_excerpt"
      - "text-based finding: offending_text occurs in the normalized visible text of the page (shared text rule); ABSENT finding: skip this check"
      - "proposed_text is non-empty; for a text-based finding it differs from offending_text"
      - "no status change without a gate/cli.py action; planner whitelist has no status tool"
  a3_reader_visibility:
    when: "before each series, keyless, on the holdout after its manifest check"
    checks:
      - "every text block of the grader's visible text (one block per block element) appears in the system reader's output (shared text rule)"
      - "every primary trigger (except absent type) and every key span appears in the reader's output"
      - "for every absent-type key cell, no required_content string and no absent_token appears in the reader's output"
    gated_on: "private holdout keys"
    reported_only_on: "development keys (evals/v2/july_primaries.yaml with the July v1.0 key; P2 development keys)"
  holdout_markers: "case ID pattern h<n>-NN, the strings key.yaml, briefs.md and adjudication.md, and the holdout_root path; none may appear in agent input or output"

# ---------------------------------------------------------------------
# Component B: LLM judgment quality, Standard procedure (eval-gate §3, §5)
# ---------------------------------------------------------------------
component_b:
  case: "one scenario page with exactly one predeclared primary decision (evals/v2/SCENARIO_SPEC.md)"
  positive_class: "VIOLATION: the page breaks the rule (key verdict)"
  asserted: "a finding with verdict VIOLATION and a CONFIRMED adjudication row (policy/ADJUDICATION_POLICY.md §5)"
  decided: "a cell is decided in a run iff its check task is DONE and has a finding for that rule"
  claim:
    statement: "at least 80% of scenario cases pass"
    why_80: "lowest table row; a wrong output costs reviewer time or a missed synthetic violation, and a human approves every proposal. July (Sonnet) missed 8 cells; 6 trace to the reader defect D1 and D7 targets the other 2, so a repaired system is expected well above 80%"
    min_cases: 30
    allowed_failing_cases: 2
    runs_per_case: 3
    case_passes_iff: "the primary decision is right in all 3 runs"
  primary_decision_passes_in_a_run_iff:
    always_a_miss: "the primary cell is not decided (task FAILED or DEAD_LETTER, or no finding for the rule), whatever the expected verdict"
    expected_violation_text: "asserted, and the excerpt passes evidence grading"
    expected_violation_missing_term: "asserted, and the excerpt starts with 'ABSENT:' or passes evidence grading against the offer span"
    expected_violation_absent: "asserted (any excerpt; assertion only)"
    expected_violation_not_asserted: "a miss: DISPUTED, REJECTED, or a non-VIOLATION verdict"
    expected_compliant_or_na: "decided and not asserted; N/A primaries test 'not flagged' only, exactly like COMPLIANT ones"
  off_target_guardrail:
    unit: "page (same independent unit as the claim)"
    scored_cells: "every non-primary cell of every holdout page"
    material_error:
      - "a CONFIRMED assertion on a cell whose key is not VIOLATION (false alarm)"
      - "a key VIOLATION cell that is not asserted (missed violation)"
      - "a cell that is not decided (task FAILED or DEAD_LETTER, or no finding)"
    not_material: "NOT_APPLICABLE vs COMPLIANT mix-ups (diagnostic only)"
    page_unclean_iff: "at least one material error in any of its 3 runs"
    open_owner_decision_rt1_06: "keep the approved reading, or adopt the recommended one: (1) a cell counts only if it has a material error in at least 2 of its 3 runs; (2) sibling cells (same rule family as the primary, other market, same page) are not scored, because they repeat the primary decision. See STATE.md P1 entry"
    max_unclean_pages: 6
    of_pages: 30
    supports: "with 24 or more clean pages of 30, at least 64% of scenario pages are free of material off-target errors (one-sided 95%; computed 0.643)"
  b_passes_iff: "failing cases <= 2 AND unclean pages <= 6"

# Evidence grading for text and missing_term primaries. Exact, no fuzzy match.
evidence_grading:
  normalize_steps_in_order:
    - "Unicode NFKC"
    - "remove format characters (Unicode category Cf: soft hyphen, zero-width space, joiners)"
    - "casefold"
    - "map every Unicode quotation mark and apostrophe (incl. U+2018-U+201F, U+00AB, U+00BB, U+2039, U+203A, U+0060) to ' or \""
    - "map every Unicode hyphen and dash (U+2010-U+2015, U+2212, U+FE58, U+FE63, U+FF0D) to '-'"
    - "'...' to the ellipsis character U+2026"
    - "every whitespace run to one space; strip"
  shared_text_rule: "grader, system reader (read_page) and checker tool (D5) use one shared extractor and normalize (P2 moves them from evals/check_holdout.py into one module both sides import): text of every element outside script, style, template, comments and elements with the hidden attribute; title included; one space at every block-element boundary, none at inline boundaries; HTML entities decoded"
  page_text: "normalized visible text of the page by the shared text rule"
  excerpt_cleanup: "strip surrounding quotation marks; '[…]' and '(…)' count as the ellipsis character"
  excerpt_parts: "the excerpt is split on the ellipsis character; empty parts dropped; each part must occur in page_text, else OFF_PAGE (a miss)"
  core_span: "the key's first span is the core span; key spans each occur exactly once in page_text (self-check)"
  overlap: "pass iff some excerpt part and the core span share at least min(15, length of the core span) characters of page_text; else NO_OVERLAP (a miss)"
  length_cap: "total length of excerpt parts at most max(200, 2 x core span length) characters; else TOO_LONG (a miss)"
  absent_marker: "an excerpt starting with 'ABSENT:' skips the verbatim check; on a text-type key cell it fails grading (ABSENT_ON_TEXT, a miss); on a missing_term or absent key cell it passes"
  numeric_tolerance: "none; strings compared exactly after normalize"

result_rules:
  PASS: "series completed; A all pass; B passes; 30 valid cases"
  FAIL:
    - "series completed and any A check fails, or B fails"
    - "A1 or A3 fails before the series: FAIL for that commit, no series is run"
  INVALID_RUN:
    when:
      - "an exception or hang raised in runner or grader code (evals/), not in system code"
      - "provider auth failure, provider rate limit or provider overload, identified from the provider's logged error type"
      - "holdout files do not match the committed manifest at series start"
      - "verifier checkout not at the pin, or not clean, at series start"
    decided: "from exit codes and logged error types only, before any score is computed or read"
    next: "fix the machinery and rerun the whole series (all 3 runs); the invalid series stays recorded; no extra approval"
  inside_the_automation_is_a_miss: "any exception, hang or timeout raised while code under orchestrator/, agents/, nodes/, intake/ or gate/ runs, agent error, budget cap, schema dead-letter: the run is scored as is; non-terminal tasks fail A2"
  valid_case: "listed in the holdout manifest committed before the first run and passing the self-check; a case ruled wrong after a run does not change that run's result (eval-gate §7)"
  NOT_ENOUGH_CASES: "fewer than 30 valid cases at series start; no % claim, no sign-off"
  exit_code: "runner exits 0 only for a completed valid series (PASS or FAIL); INVALID RUN and NOT ENOUGH CASES exit non-zero"
  manifest: "immutable after a holdout's first run; a changed holdout gets a new holdout ID by owner decision"
  holdout_retirement: "a holdout is retired after any completed official series, PASS or FAIL, and becomes local development data; every later version is gated on a fresh holdout under the same spec"
  attempts: "no limit (eval-gate hard rule 6); every completed result recorded"

# Sanitized results: the only fields that may enter Git from a holdout
# run (evals/results/<series_id>.json and evals/EVAL_RESULTS.md).
# No page text, excerpts, spans, rationales or proposal text. A keyless
# test enforces the allowlist (P2).
sanitized_results_allowlist:
  series: [series_id, date, commit, config_sha256, holdout_id, manifest_sha256, model, verifier_pin, ruleset_version, ruleset_sha256, run_db_names, earlier_series_count, result, exit_code]
  component_a: [check_name, run_index, passed, count]
  per_case: [case_id, jurisdiction, rule_id, run_index, passed, miss_category]
  per_page_off_target: [case_id, unclean, false_alarm_cells, missed_cells, undecided_cells]
  per_page_off_target_types: "integer counts only, never rule IDs"
  aggregates: [cases_passed, cases_failed, unclean_pages, tp, fp, fn, precision, recall, na_accuracy, confirmed, rejected, disputed, rejected_correct, rejected_wrong, flips, cost_usd, turns, wall_clock_s]
  miss_categories: [NOT_DECIDED, NOT_ASSERTED, ASSERTED_ON_NON_VIOLATION, OFF_PAGE, NO_OVERLAP, TOO_LONG, ABSENT_ON_TEXT, DISPUTED, REJECTED]
  miss_pattern: "one free-text field per series, written or approved by the owner: the failure pattern in general words; no page text, spans, trigger wording or brand names from a holdout page"

# Recorded, never gated. Cell-level figures are marked "clustered by
# page, no binomial claim".
diagnostics:
  - "per-market and pooled precision and recall over all cells"
  - "NOT_APPLICABLE accuracy over rule-level N/A cells"
  - "adjudication table: CONFIRMED / REJECTED / DISPUTED; rejected-correct vs rejected-wrong"
  - "flips: cells whose outcome differs between the 3 runs"
  - "off-target page count under both guardrail readings (any run; 2 of 3 runs)"
  - "planner proposal checks"
  - "cost, turns and wall clock per run"
  - "v1 thresholds below, for comparison with July only"

datasets:
  development:
    july:
      pages_dir: evals/dataset/pages/
      answer_key: evals/answer_key.yaml
      key_version: v1.0
      primaries: evals/v2/july_primaries.yaml
      gated: false
      note: "July results after ruleset v1.1 are regression evidence only (RT1-20)"
    p2_pages: "about 8 public pages added in P2 under evals/v2/SCENARIO_SPEC.md §8; gated: false"
  holdout:
    spec: evals/v2/SCENARIO_SPEC.md
    location: "private; local setting holdout_root in the gitignored file config.local.yaml; never a tracked path"
    official_runs: "the cage root is switched to the holdout pages through the local setting (P2); pages are never copied into the repo; run DBs and logs are written under holdout_root; console output is sanitized"
    manifest: "evals/v2/holdouts/H<n>.sha256: page hashes after the self-check, full manifest (pages, briefs, key, adjudication) before the first run"
    current: H1
  rulesets_dir: rulesets/
  ruleset_version: "v1.1 once signed by the owner (evals/v2/RULESET_V1_1.md)"
  ruleset_sha256: "recorded here for the three rule files when the signed v1.1 text is written (P2, before any run)"
  provenance: "synthetic pages and rules (ADR-0003); keys by the three-actor protocol (ADR-0004, SCENARIO_SPEC §6); holdout pages are hand-briefed, not generated by a script, so regeneration is not deterministic by design; the manifest fixes their content"

model_routing:
  development: claude-haiku-4-5-20251001
  official: claude-sonnet-4-6
  official_fallback: "only if the P3 preflight finds claude-sonnet-4-6 unavailable; owner decides the replacement and it is recorded before the series"

budget:
  status: "PROPOSED, not authorized; no model run until the owner authorizes"
  development_usd_notional: 30
  official_series_usd_notional: 110

claim_discipline: >
  Component B supports a detection-accuracy claim on the predeclared
  decisions, with evidence checked for text violations. Component A
  supports a reliability and planner-integrity claim. Neither implies the
  other, and no result implies whole-page or legal compliance screening.

# Used only after a PASS; N, k filled from the results artifact.
public_claim_wording: >
  N of 30 separately briefed synthetic compliance scenarios (at most 2
  failed) got their predeclared decision right in all 3 runs, with
  evidence checked for text violations. This supports a pass rate of at
  least 80% (one-sided 95%) for scenarios drawn under this spec. At most
  6 of 30 pages showed any other material error, and all deterministic
  reliability and planner-integrity checks passed. Earlier official
  series: k, all recorded.

v1_reference:
  note: "v1.0 gate, comparison only; its July result (gate-9328e564, FAIL) stands"
  violation_detection:
    precision_min: 0.95
    recall_min: 0.90
    scope: "pooled AND per jurisdiction"
  not_applicable_handling:
    correct_min: 0.90
